<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мої витрати</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Значення за замовчуванням — фіолетова тема; інші теми підставляє JS */
  :root {
    --bg: #4a3f70; --card: #3e3460; --deep: #332a52;
    --accent: #f4c58f; --accent-2: #f8d7b0; --on-accent: #2e2649;
    --chip: #2e2649; --chip-text: #ffffff;
    --text: #ffffff; --muted: #b9b1d6;
    --l1: #5d4f86; --l2: #b08fd9; --l2-text: #2e2649;
    --danger: #f2877d; --good: #8fd9b6;
    --shadow: 0 12px 28px rgba(22, 15, 45, .38);
    --shadow-in: inset 0 2px 6px rgba(15, 10, 32, .45);
    --scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); transition: background .25s; }
  body { background: transparent; }

  /* ---------- анімований фон: розмиті плями кольорів теми ---------- */
  .bg-anim { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg-anim i { position: absolute; width: 62vmax; height: 62vmax; border-radius: 50%; filter: blur(55px); opacity: var(--blob-op, .45); will-change: transform; }
  .bg-anim i:nth-child(1) { background: var(--accent); top: -28vmax; left: -26vmax; animation: drift1 11s ease-in-out infinite alternate; }
  .bg-anim i:nth-child(2) { background: var(--l2); bottom: -30vmax; right: -28vmax; animation: drift2 13s ease-in-out infinite alternate; }
  .bg-anim i:nth-child(3) { background: var(--l1); top: 25%; left: 5%; width: 50vmax; height: 50vmax; animation: drift3 9s ease-in-out infinite alternate; }
  .bg-anim i:nth-child(4) { background: var(--accent-2); top: 55%; left: -20vmax; width: 42vmax; height: 42vmax; animation: drift4 12s ease-in-out infinite alternate; }
  .bg-anim i:nth-child(5) { background: var(--accent); top: 5%; right: -18vmax; width: 38vmax; height: 38vmax; animation: drift5 10s ease-in-out infinite alternate; }
  @keyframes drift1 { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(45vw, 15vh) scale(1.25); } 66% { transform: translate(20vw, 45vh) scale(.85); } 100% { transform: translate(55vw, 65vh) scale(1.1); } }
  @keyframes drift2 { 0% { transform: translate(0, 0) scale(1); } 33% { transform: translate(-40vw, -20vh) scale(1.3); } 66% { transform: translate(-15vw, -55vh) scale(.9); } 100% { transform: translate(-50vw, -40vh) scale(1.15); } }
  @keyframes drift3 { 0% { transform: translate(0, 0) scale(.85); } 50% { transform: translate(40vw, -25vh) scale(1.25); } 100% { transform: translate(-15vw, 25vh) scale(.95); } }
  @keyframes drift4 { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(60vw, -30vh) scale(1.35); } 100% { transform: translate(30vw, 20vh) scale(.9); } }
  @keyframes drift5 { 0% { transform: translate(0, 0) scale(1.1); } 50% { transform: translate(-55vw, 35vh) scale(.8); } 100% { transform: translate(-25vw, 60vh) scale(1.3); } }
  .no-anim .bg-anim { display: none; }
  /* матове скло: крізь картки видно, як рухається фон (лише коли анімація увімкнена) */
  html:not(.no-anim) .card, html:not(.no-anim) .tile:not(.accent), html:not(.no-anim) .box, html:not(.no-anim) .nav-in, html:not(.no-anim) .pcard {
    background: color-mix(in srgb, var(--card) 72%, transparent);
    -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2); }
  @media (prefers-reduced-motion: reduce) { .bg-anim i { animation: none; } }
  body { margin: 0; color: var(--text); font: 400 15px/1.4 Poppins, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, select { font-family: inherit; }
  [hidden] { display: none !important; }
  main { max-width: 520px; margin: 0 auto; padding: 18px 16px 120px; }

  /* ---------- заголовок ---------- */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 18px; min-height: 50px; }
  .title { line-height: 1.15; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .title .light { font-size: 16px; font-weight: 400; color: var(--muted); }
  .title .bold { font-size: 23px; font-weight: 700; }
  .head-right { display: flex; gap: 8px; align-items: center; }
  .box { background: var(--card); border-radius: 20px; padding: 8px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 4px; }
  .ibtn { width: 34px; height: 34px; border-radius: 12px; border: 0; background: var(--deep); color: var(--text); font-size: 18px; cursor: pointer; box-shadow: var(--shadow-in); display: grid; place-items: center; padding: 0; }
  .ibtn svg { width: 18px; height: 18px; }
  .month-label { min-width: 70px; text-align: center; font-size: 13px; font-weight: 600; line-height: 1.2; }
  .month-label small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; }

  /* ---------- картка-чек з підсумком ---------- */
  .ticket { position: relative; background: var(--accent); color: var(--on-accent); border-radius: 26px; padding: 20px 20px 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .ticket .lbl { font-size: 13px; font-weight: 500; opacity: .75; }
  .total { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 2px; word-break: break-word; }
  .ticket .dash { position: relative; border-top: 2px dashed rgba(0, 0, 0, .2); border-top-color: color-mix(in srgb, var(--on-accent) 25%, transparent); margin: 14px 0 12px; }
  /* вирізи «чека» — справжні прозорі отвори (маска), щоб крізь них було видно анімований фон; --ny — висота пунктиру */
  .ticket { --ny: 58%;
    -webkit-mask: radial-gradient(circle at 0 var(--ny), transparent 11px, #000 11.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% var(--ny), transparent 11px, #000 11.5px) right / 51% 100% no-repeat;
    mask: radial-gradient(circle at 0 var(--ny), transparent 11px, #000 11.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% var(--ny), transparent 11px, #000 11.5px) right / 51% 100% no-repeat; }
  .sub { font-size: 12px; font-weight: 500; opacity: .7; }
  .mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .mini div { background: var(--chip); color: var(--chip-text); border-radius: 16px; padding: 9px 10px; box-shadow: 0 8px 16px rgba(0, 0, 0, .18); min-width: 0; }
  .mini small { display: block; font-size: 10px; opacity: .7; }
  .mini b { display: block; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- картки ---------- */
  .card { background: var(--card); border-radius: 26px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow); }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .link { background: none; border: 0; color: var(--accent); font-size: 13px; font-weight: 600; cursor: pointer; padding: 0; }
  .chip-btn { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .chip-btn.ghost { background: var(--deep); color: var(--text); box-shadow: var(--shadow-in); }
  .muted { color: var(--muted); font-size: 13px; }
  .center { text-align: center; }

  input, select { width: 100%; background: var(--deep); color: var(--text); border: 0; border-radius: 16px; padding: 12px 14px; font-size: 14px; font-weight: 500; outline: none; box-shadow: var(--shadow-in); color-scheme: var(--scheme); }
  input::placeholder { color: var(--muted); }
  input:focus { box-shadow: var(--shadow-in), 0 0 0 2px var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row > * { flex: 1; min-width: 0; }

  .pills { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: var(--deep); border-radius: 16px; padding: 5px; box-shadow: var(--shadow-in); }
  .pills.two { grid-template-columns: 1fr 1fr; }
  .pills button { background: transparent; color: var(--muted); border: 0; border-radius: 12px; padding: 7px 0; font-size: 12px; font-weight: 600; cursor: pointer; }
  .pills.two button { padding: 10px 0; font-size: 14px; }
  .pills button.on { background: var(--accent); color: var(--on-accent); }

  .btn { width: 100%; margin-top: 16px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 18px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 18px rgba(0, 0, 0, .15); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: var(--deep); color: var(--text); box-shadow: var(--shadow-in); }
  .btn.danger { background: transparent; color: var(--danger); box-shadow: none; margin-top: 6px; }

  /* ---------- нижнє меню ---------- */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; pointer-events: none; }
  .nav-in { pointer-events: auto; width: 100%; max-width: 520px; background: var(--card); border-radius: 26px 26px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.25); display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); }
  .nav button { background: none; border: 0; color: var(--muted); font-size: 10px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; padding: 4px 0; }
  .nav button svg { width: 22px; height: 22px; }
  .nav button.on { color: var(--accent); font-weight: 600; }
  .nav .fab { width: 58px; height: 58px; margin: -30px auto 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 30px; font-weight: 500; line-height: 1; box-shadow: 0 10px 22px rgba(0,0,0,.35), 0 0 0 6px var(--bg); justify-content: center; }
  .nav .fab svg { width: 26px; height: 26px; }

  /* ---------- бюджет ---------- */
  .budget-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .budget-top b { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .progress { height: 12px; border-radius: 999px; background: var(--deep); box-shadow: var(--shadow-in); overflow: hidden; margin: 10px 0 8px; }
  .progress i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .3s; }
  .progress i.warn { background: #f6cf7a; }
  .progress i.over { background: var(--danger); }
  .bcat { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; }
  .bcat .av { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; }
  .bcat .grow { flex: 1; min-width: 0; }
  .bcat .progress { height: 7px; margin: 4px 0 0; }
  .bcat .top { display: flex; justify-content: space-between; gap: 6px; }
  .bcat .top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- календар ---------- */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; justify-items: center; }
  .cal .wd { font-size: 11px; color: var(--muted); font-weight: 500; }
  .cal .d { width: 100%; max-width: 44px; aspect-ratio: 1; border-radius: 14px; border: 0; background: var(--deep); color: var(--text); cursor: pointer; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; box-shadow: var(--shadow-in); }
  .cal .d .n { font-size: 13px; font-weight: 600; }
  .cal .d .s { font-size: 9px; font-weight: 600; margin-top: 3px; opacity: .85; font-variant-numeric: tabular-nums; }
  .cal .d.l1 { background: var(--l1); box-shadow: none; }
  .cal .d.l2 { background: var(--l2); color: var(--l2-text); box-shadow: none; }
  .cal .d.l3 { background: var(--accent); color: var(--on-accent); box-shadow: none; }
  .cal .d.today { outline: 2px solid var(--accent); outline-offset: 2px; }
  .legend { display: flex; justify-content: center; gap: 14px; margin-top: 14px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }

  /* ---------- записи ---------- */
  .day { font-size: 12px; color: var(--muted); font-weight: 500; margin: 14px 2px 8px; display: flex; justify-content: space-between; }
  .day:first-child { margin-top: 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 18px; margin-bottom: 8px; background: var(--deep); cursor: pointer; width: 100%; border: 0; color: inherit; text-align: left; font: inherit; }
  .item:active { transform: scale(.99); }
  .item .ico { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; }
  .item .info { flex: 1; min-width: 0; }
  .item .info div:first-child { font-weight: 500; font-size: 14px; }
  .item .info div:last-child { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sum { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; font-size: 14px; white-space: nowrap; }
  .item .sum.inc { color: var(--good); }
  .item .sum small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 8px 0 4px; font-size: 14px; }
  .empty .ring { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center; background: var(--deep); box-shadow: var(--shadow-in); font-size: 22px; }

  /* ---------- пошук і фільтри ---------- */
  .search { position: relative; margin-bottom: 12px; }
  .search input { padding-left: 42px; }
  .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: 0 0 auto; background: var(--card); color: var(--muted); border: 0; border-radius: 999px; padding: 7px 13px; font-size: 12px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap; }
  .chips button.on { background: var(--accent); color: var(--on-accent); }

  /* ---------- статистика ---------- */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .tile { background: var(--card); border-radius: 20px; padding: 12px; box-shadow: var(--shadow); min-width: 0; }
  .tile small { display: block; color: var(--muted); font-size: 11px; }
  .tile b { display: block; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.accent { background: var(--accent); color: var(--on-accent); }
  .tile.accent small { color: inherit; opacity: .7; }
  .cmp { display: flex; align-items: center; gap: 12px; }
  .cmp .arrow { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; font-weight: 700; background: var(--deep); box-shadow: var(--shadow-in); }
  .cmp .arrow.up { color: var(--danger); }
  .cmp .arrow.down { color: var(--good); }
  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .ch-bar { fill: var(--l2); }
  .ch-bar.hi { fill: var(--accent); }
  .ch-bar.zero { fill: var(--deep); }
  .ch-avg { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1.2; }
  .ch-lbl { fill: var(--muted); font-size: 9px; font-family: Poppins, sans-serif; }
  .ch-val { fill: var(--text); font-size: 9px; font-weight: 600; font-family: Poppins, sans-serif; }

  .bar { margin-bottom: 16px; }
  .bar:last-child { margin-bottom: 0; }
  .bar .top-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bar .top-row .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; flex: 0 0 30px; }
  .bar .top-row .nm { flex: 1; font-size: 14px; font-weight: 500; min-width: 0; }
  .bar .top-row .nm small { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .bar .top-row b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
  .bar .top-row b small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .slider { position: relative; height: 22px; border-radius: 999px; background: var(--deep); box-shadow: var(--shadow-in);
            background-image: radial-gradient(circle, color-mix(in srgb, var(--text) 50%, transparent) 1.6px, transparent 2px); background-size: 22px 22px; background-position: 11px center; }
  .slider .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px;
                  background-image: radial-gradient(circle, rgba(255,255,255,.7) 2px, transparent 2.5px); background-size: 22px 22px; background-position: 11px center; }
  .slider .knob { position: absolute; top: 50%; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); border: 3px solid var(--card); transform: translate(-50%, -50%); box-shadow: 0 4px 10px rgba(0,0,0,.3); }

  /* ---------- друзі ---------- */
  .person { background: var(--deep); border-radius: 20px; padding: 12px; margin-bottom: 10px; }
  .person .p-top { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 17px; color: #2e2649; }
  .person .p-info { flex: 1; min-width: 0; }
  .person .p-info div:first-child { font-weight: 600; }
  .person .p-info div:last-child { font-size: 12px; }
  .pos { color: var(--good); }
  .neg { color: var(--danger); }
  .person .p-acts { display: flex; gap: 6px; margin-top: 10px; }
  .person .p-acts button { flex: 1; }
  .person .p-list { margin-top: 10px; border-top: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); padding-top: 8px; font-size: 12px; color: var(--muted); }
  .person .p-list div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }

  /* ---------- налаштування ---------- */
  .set-lbl { font-size: 13px; color: var(--muted); font-weight: 500; margin: 16px 2px 8px; }
  .set-lbl:first-of-type { margin-top: 0; }
  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .theme { background: var(--deep); border: 0; border-radius: 18px; padding: 12px 6px 10px; color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: var(--shadow-in); }
  .theme .sw { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 4px 10px rgba(0,0,0,.25); }
  .theme.on { box-shadow: 0 0 0 2px var(--accent); }
  .theme.custom { grid-column: 1 / -1; flex-direction: row; justify-content: center; gap: 12px; padding: 10px; font-size: 13px; }
  .theme.custom .sw { width: 34px; height: 34px; }
  .picker { margin-top: 12px; background: var(--deep); border-radius: 20px; padding: 12px; box-shadow: var(--shadow-in); }
  .picker .pills { background: var(--card); box-shadow: none; }
  .sv { position: relative; height: 170px; margin-top: 12px; border-radius: 14px; touch-action: none; cursor: crosshair;
        background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent); background-color: #f00; }
  .hue { position: relative; height: 20px; margin: 14px 4px 0; border-radius: 999px; touch-action: none; cursor: pointer;
         background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%); }
  .knob-p { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.4); }
  .hue .knob-p { top: 50%; }
  .hex-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .hex-row .prev { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .hex-row input { background: var(--card); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .money-in { position: relative; }
  .money-in input { padding-right: 44px; }
  .money-in span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
  details summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 14px; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  .bc-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .bc-row .av { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; }
  .bc-row .nm { flex: 0 0 92px; font-size: 13px; }
  .bc-row .money-in { flex: 1; }
  .bc-row input { padding: 9px 40px 9px 12px; }
  .rec-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; }

const clamp01 = x => Math.min(1, Math.max(0, x));
function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
const rgbToHex = (r, g, b) => '#' + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('');
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s: max ? d / max : 0, v: max };
}
function hsvToRgb(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return (v - v * s * Math.max(0, Math.min(k, 4 - k, 1))) * 255; };
  return [f(5), f(3), f(1)];
}
const mix = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(...A.map((x, i) => x + (B[i] - x) * t)); };
function lum(hex) {
  const [r, g, b] = hexToRgb(hex).map(x => { x /= 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

// з двох кольорів (фон + акцент) будуємо повну тему так, щоб текст лишався читабельним
function deriveTheme({ bg, accent }) {
  const dark = lum(bg) < 0.3;
  const text = dark ? '#ffffff' : '#22202c';
  // на майже чорному фоні темніше вже нікуди — тоді картки робимо трохи світлішими
  const veryDark = lum(bg) < 0.02;
  const card = veryDark ? mix(bg, '#ffffff', 0.1) : dark ? mix(bg, '#000000', 0.16) : mix(bg, '#ffffff', 0.8);
  const deep = veryDark ? mix(bg, '#ffffff', 0.04) : dark ? mix(bg, '#000000', 0.32) : mix(bg, '#000000', 0.05);
  const accLight = lum(accent) > 0.4;
  const onAccent = accLight ? mix(bg, '#000000', 0.7) : '#ffffff';
  const chip = accLight ? onAccent : mix(accent, '#000000', 0.45);
  const l1 = mix(deep, accent, 0.3), l2 = mix(deep, accent, 0.65);
  return {
    bg, card, deep, accent, accent2: mix(accent, '#ffffff', 0.55), onAccent, chip, chipText: '#ffffff',
    text, muted: mix(text, bg, 0.4), l1, l2, l2Text: lum(l2) > 0.35 ? mix(bg, '#000000', 0.7) : '#ffffff',
    shadow: hexToRgb(mix(bg, '#000000', 0.7)).join(','), scheme: dark ? 'dark' : 'light',
  };
}

   ===================================================================== */
const useCloud = !!(tg && tg.initData && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
const cs = useCloud ? tg.CloudStorage : null;
const CHUNK = 3500; // ліміт CloudStorage — 4096 символів на ключ

function call(fn, ...args) {
  return new Promise((resolve, reject) => fn.call(cs, ...args, (err, val) => err ? reject(err) : resolve(val)));
}
// великі значення діляться на шматки: <prefix>0, <prefix>1 … і лічильник у ключі countKey
async function loadBlob(prefix, countKey, localKey) {
  if (!useCloud) { try { return localStorage.getItem(localKey) || ''; } catch { return ''; } }
  const n = parseInt(await call(cs.getItem, countKey) || '0', 10);
  if (!n) return '';
  const keys = Array.from({ length: n }, (_, i) => prefix + i);
  const vals = await call(cs.getItems, keys);
  return keys.map(k => vals[k] || '').join('');
}
function split(str) {
  const out = [];
  let i = 0;
  while (i < str.length) {
    let end = Math.min(i + CHUNK, str.length);
    if (end < str.length && /[\uD800-\uDBFF]/.test(str[end - 1])) end--; // не розрізати емодзі навпіл
    out.push(str.slice(i, end));
    i = end;
  }
  return out;
}
async function saveBlob(prefix, countKey, localKey, str) {
  if (!useCloud) { try { localStorage.setItem(localKey, str); } catch {} return; }
  const chunks = split(str);
  const old = parseInt(await call(cs.getItem, countKey) || '0', 10);
  for (let i = 0; i < chunks.length; i++) await call(cs.setItem, prefix + i, chunks[i]);
  await call(cs.setItem, countKey, String(chunks.length));
  if (old > chunks.length) {
    const rm = [];
    for (let i = chunks.length; i < old; i++) rm.push(prefix + i);
    await call(cs.removeItems, rm);
  }
}
async function loadCfg() {
  try {
    const raw = useCloud ? await call(cs.getItem, 'cfg') : localStorage.getItem('cfg');
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function saveCfg() {
  const raw = JSON.stringify(cfg);
  if (useCloud) cs.setItem('cfg', raw, () => {});

    for (const x of data) if (SYM[x.cc]) { r[x.cc] = x.rate; date = x.exchangedate; }

  return v * rates[cur] / rates[cfg.display];
}
const isInc = e => e.t === 'inc';
const isEntry = e => !e.t || e.t === 'inc'; // звичайні витрати й доходи (без розрахунків, переказів, цілей)
const isExp = e => !e.t;
const myPart = e => e.my ?? e.a;              // для спільних витрат рахуємо лише свою частку
const dispVal = e => toDisp(isInc(e) ? e.a : myPart(e), e.cur);
function sumDisp(list, missing) {
  let s = 0;
  for (const e of list) {
    const v = dispVal(e);
    if (Number.isFinite(v)) s += v; else if (missing) missing.add(e.cur);
  }
  return s;
}
const monthEntries = (y, m) => { const p = ymOf(y, m); return items.filter(e => isEntry(e) && e.d.startsWith(p)); };

/* =====================================================================
   Регулярні платежі — додаються самі, коли настає їхній день
   ===================================================================== */
function nextYM(ym) { let [y, m] = ym.split('-').map(Number); m++; if (m > 12) { m = 1; y++; } return `${y}-${pad2(m)}`; }
function runRecurring() {
  let changed = false;
  const t = today(), curYM = t.slice(0, 7);
  for (const r of extra.recurring) {
    let ym = nextYM(r.last);
    while (ym <= curYM) {
      const [y, m] = ym.split('-').map(Number);
      const d = `${ym}-${pad2(Math.min(r.day, new Date(y, m, 0).getDate()))}`;
      if (d > t) break;
      const e = { id: uid(), a: r.a, cur: r.cur, c: r.c, n: r.n, d, r: r.id };
      if (r.acc) e.acc = r.acc;
      if (r.t) e.t = r.t;
      items.push(e);
      r.last = ym; changed = true;
      ym = nextYM(ym);
    }
  }
  return changed;
}

   Навігація
   ===================================================================== */
let page = 'home';
let prevPage = 'home';
let view = (() => { const d = new Date(); return { y: d.getFullYear(), m: d.getMonth() }; })();
let selectedDay = null;
let hFilter = 'all';
let hQuery = '';
let openPerson = null;

let profPrev = 'home';
function go(p) {
  if (p === 'settings' && page !== 'settings') prevPage = page;
  if (p === 'profile' && page !== 'profile' && page !== 'settings') profPrev = page;
  page = p;
  document.querySelectorAll('.page').forEach(el => { el.hidden = el.id !== 'page-' + p; });
  document.querySelectorAll('.nav [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === p));
  window.scrollTo(0, 0);
  render();
  updateBack();
}
function updateBack() {
  const show = sheetOpen() || page === 'settings' || page === 'profile';
  try { show ? tg.BackButton.show() : tg.BackButton.hide(); } catch {}
}
function onBack() {
  if (sheetOpen()) closeForm();
  else if (page === 'settings') go(prevPage);
  else if (page === 'profile') go(profPrev);
}
function shiftMonth(delta) {
  view.m += delta;
  if (view.m < 0) { view.m = 11; view.y--; }
  if (view.m > 11) { view.m = 0; view.y++; }
  selectedDay = null;
  render();
}

function alertMsg(text) { tg && tg.showAlert && useCloud ? tg.showAlert(text) : alert(text); }
function confirmMsg(text) {
  return new Promise(res => tg && tg.showConfirm && useCloud ? tg.showConfirm(text, res) : res(confirm(text)));
}
function haptic(type) { try { tg.HapticFeedback.notificationOccurred(type); } catch {} }
function tick() { try { tg.HapticFeedback.selectionChanged(); } catch {} }
let toastTimer;
function toast(text, ms = 2400) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);

function applyLang(id) {

  nf = new Intl.NumberFormat(T.locale, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function render() {
  const titles = { home: [T.appLight, T.appBold], history: [T.myExp, T.navHistory], stats: [T.myExp, T.navStats], friends: [T.myExp, T.navFriends], settings: [T.myExp, T.settings], profile: [T.myExp, T.profile] };

function compact(v) {
  const dec = T.locale === 'uk-UA' ? ',' : '.';
  if (v >= 10000) return Math.round(v / 1000) + 'k';
  if (v >= 1000) return (Math.round(v / 100) / 10).toString().replace('.', dec) + 'k';
  return Math.round(v).toString();
}

function itemRow(e, withDate) {
  const c = catOf(e.c);
  const b = document.createElement('button');
  b.className = 'item';
  const inc = isInc(e);
  const v = dispVal(e);
  const cur = e.cur || 'UAH';
  const marks = (e.r ? ' 🔁' : '') + (e.sp ? ' 👥' : '');
  const subParts = [];
  if (withDate) subParts.push(fmtDay(e.d));
  if (e.n) subParts.push(e.n);
  if (e.sp) subParts.push(T.yourShare(money(e.my, cur)));
  let small = '';
  if (cur !== cfg.display && Number.isFinite(v)) small = `<small>≈ ${money(v, cfg.display)}</small>`;
  b.innerHTML = `<div class="ico" style="background:${catColor(c)}">${c.ico}</div>
    <div class="info"><div>${esc(catName(e.c))}${marks}</div><div>${esc(subParts.join(' · '))}</div></div>
    <div class="sum${inc ? ' inc' : ''}">${inc ? '+' : '−'}${money(e.a, cur)}${small}</div>`;
  b.onclick = () => { tick(); openForm(e); };
  return b;
}

/* ---------- Головна ---------- */
function renderHome() {
  const list = monthEntries(view.y, view.m);
  const exp = list.filter(isExp), inc = list.filter(isInc);
  const missing = new Set();
  const total = sumDisp(exp, missing);
  const incTotal = sumDisp(inc, missing);
  $('total').textContent = money(total, cfg.display);
  const mixed = list.some(e => (e.cur || 'UAH') !== cfg.display);
  let sub = list.length ? T.count(list.length) : T.noExp;
  if (mixed && ratesDate) sub += ` · ${T.rate} ${ratesDate}`;
  if (missing.size) sub += ` · ${T.noRate} ${[...missing].join(', ')}`;
  $('totalSub').textContent = sub;

  const t = today();
  const isCur = t.startsWith(ymOf(view.y, view.m));
  const daysIn = new Date(view.y, view.m + 1, 0).getDate();
  const days = isCur ? +t.slice(8) : daysIn;
  const byDay = {};
  for (const e of exp) { const v = dispVal(e); if (Number.isFinite(v)) byDay[e.d] = (byDay[e.d] || 0) + v; }
  $('todayLbl').textContent = isCur ? T.today : T.maxDay;
  $('todaySum').textContent = money(isCur ? (byDay[t] || 0) : Math.max(0, ...Object.values(byDay)), cfg.display);
  $('avgSum').textContent = money(total / days, cfg.display);
  $('incSum').textContent = money(incTotal, cfg.display);
  $('balSum').textContent = money(incTotal - total, cfg.display);

  const tk = document.querySelector('#page-home .ticket');
  tk.style.setProperty('--ny', tk.querySelector('.dash').offsetTop + 'px');
  renderAccounts();
  renderGoals();
  renderBudget(exp, total, isCur ? daysIn - days + 1 : 0);
  renderCalendar(byDay);

  const box = $('recent');
  box.innerHTML = '';
  const recent = [...list].sort((a, b) => b.d.localeCompare(a.d) || b.id.localeCompare(a.id)).slice(0, 5);
  if (!recent.length) box.innerHTML = `<div class="empty"><div class="ring">🧾</div>${T.emptyAll}</div>`;
  for (const e of recent) box.appendChild(itemRow(e, true));
}

function budgetAmt(v) { return toDisp(v, extra.budget.cur); }
function renderBudget(exp, total, daysLeft) {
  const card = $('budgetCard');
  const b = extra.budget;
  const catLimits = Object.entries(b.cats).filter(([, v]) => v > 0);
  if (!(b.total > 0) && !catLimits.length) {
    card.innerHTML = `<div class="muted">${T.setBudget}</div><button class="btn ghost" id="toBudget">${T.setBudgetBtn}</button>`;
    $('toBudget').onclick = () => { go('settings'); setTimeout(() => $('budgetTotal').focus(), 50); };
    return;
  }
  let html = `<h2>${T.budget}</h2>`;
  if (b.total > 0) {
    const lim = budgetAmt(b.total);
    const pct = lim ? total / lim * 100 : 0;
    const left = lim - total;
    html += `<div class="budget-top"><b>${money(total, cfg.display)} <span class="muted">/ ${money(lim, cfg.display)}</span></b></div>
      <div class="progress"><i class="${pct >= 100 ? 'over' : pct >= 80 ? 'warn' : ''}" style="width:${Math.min(100, pct)}%"></i></div>
      <div class="muted">${left >= 0 ? T.budgetLeft(money(left, cfg.display)) : `<span class="neg">${T.budgetOver(money(-left, cfg.display))}</span>`}${left > 0 && daysLeft ? ' · ' + T.perDay(money(left / daysLeft, cfg.display)) : ''}</div>`;
  }
  for (const [id, limRaw] of catLimits) {
    const lim = budgetAmt(limRaw);
    const spent = sumDisp(exp.filter(e => e.c === id));
    const pct = lim ? spent / lim * 100 : 0;
    const c = catOf(id);
    html += `<div class="bcat"><span class="av" style="background:${catColor(c)}">${c.ico}</span><div class="grow">
      <div class="top"><span>${esc(catName(id))}</span><span>${compact(spent)} / ${money(lim, cfg.display)}</span></div>
      <div class="progress"><i class="${pct >= 100 ? 'over' : pct >= 80 ? 'warn' : ''}" style="width:${Math.min(100, pct)}%"></i></div></div></div>`;
  }
  card.innerHTML = html;
}

function renderCalendar(byDay) {
  const box = $('cal');
  box.innerHTML = T.weekdays.map(w => `<div class="wd">${w}</div>`).join('');
  const max = Math.max(0, ...Object.values(byDay));
  const first = (new Date(view.y, view.m, 1).getDay() + 6) % 7; // понеділок = 0
  const days = new Date(view.y, view.m + 1, 0).getDate();
  const t = today();
  for (let i = 0; i < first; i++) box.insertAdjacentHTML('beforeend', '<div></div>');
  for (let d = 1; d <= days; d++) {
    const key = iso(view.y, view.m, d);
    const sum = byDay[key] || 0;
    const level = !sum ? 0 : sum / max > 0.66 ? 3 : sum / max > 0.33 ? 2 : 1;
    const b = document.createElement('button');
    b.className = 'd' + (level ? ' l' + level : '') + (key === t ? ' today' : '');
    b.innerHTML = `<span class="n">${d}</span>${sum ? `<span class="s">${compact(sum)}</span>` : ''}`;
    b.onclick = () => { tick(); selectedDay = key; hQuery = ''; $('searchIn').value = ''; go('history'); };
    box.appendChild(b);
  }
}

/* ---------- Історія ---------- */
function renderHistory() {
  const fb = $('filters');
  fb.innerHTML = '';
  const filters = [['all', T.fAll], ['exp', T.fExp], ['inc', T.fInc], ['rec', T.fRec], ['split', T.fSplit],
    ...visibleCats('exp').map(c => ['cat:' + c.id, `${c.ico} ${catName(c.id)}`]), ...visibleCats('inc').map(c => ['cat:' + c.id, `${c.ico} ${catName(c.id)}`])];

    const b = document.createElement('button');

  }

  const q = hQuery.trim().toLowerCase();
  let list = q ? items.filter(isEntry) : monthEntries(view.y, view.m);

  if (hFilter === 'exp') list = list.filter(isExp);
  else if (hFilter === 'inc') list = list.filter(isInc);
  else if (hFilter === 'rec') list = list.filter(e => e.r);
  else if (hFilter === 'split') list = list.filter(e => e.sp);

    list = list.filter(e => [catName(e.c), e.n || '', String(e.a), nf.format(e.a), ...(e.sp ? e.sp.w : [])].join(' ').toLowerCase().includes(q));
  }

  $('clearDay').hidden = !selectedDay || !!q;
  $('histTitle').textContent = q ? T.searchAll : selectedDay ? `${T.history} · ${fmtDay(selectedDay)}` : `${T.months[view.m]} ${view.y}`;
  const box = $('list');
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = `<div class="empty"><div class="ring">${q ? '🔍' : '🧾'}</div>${q ? T.emptySearch : selectedDay ? T.emptyDay : T.emptyAll}</div>`;

  }
  const sorted = [...list].sort((a, b) => b.d.localeCompare(a.d) || b.id.localeCompare(a.id));
  let curDay = null;
  for (const e of sorted) {
    if (e.d !== curDay) {
      curDay = e.d;
      const dayList = sorted.filter(x => x.d === curDay);
      const net = sumDisp(dayList.filter(isInc)) - sumDisp(dayList.filter(isExp));
      const h = document.createElement('div');
      h.className = 'day';
      h.innerHTML = `<span>${fmtDay(curDay)}</span><span>${net > 0 ? '+' : net < 0 ? '−' : ''}${money(Math.abs(net), cfg.display)}</span>`;
      box.appendChild(h);
    }
    box.appendChild(itemRow(e, false));
  }
}

/* ---------- Статистика ---------- */
function barChart(values, labels, highlight, opts = {}) {
  const n = values.length;
  const W = 320, H = opts.h || 130, top = opts.vals ? 16 : 6, bottom = 16;
  const max = Math.max(...values, 1);
  const slot = W / n, bw = Math.max(3, slot * (opts.wide ? 0.55 : 0.62));
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  values.forEach((v, i) => {
    const h = v > 0 ? Math.max(3, (H - top - bottom) * v / max) : 3;
    const x = i * slot + (slot - bw) / 2, y = H - bottom - h;
    svg += `<rect class="ch-bar${highlight(i) ? ' hi' : ''}${v > 0 ? '' : ' zero'}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4, bw / 2).toFixed(1)}"/>`;
    if (opts.vals && v > 0) svg += `<text class="ch-val" x="${(x + bw / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle">${compact(v)}</text>`;
    if (labels[i]) svg += `<text class="ch-lbl" x="${(x + bw / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle">${labels[i]}</text>`;
  });
  if (opts.avg > 0) {
    const y = H - bottom - (H - top - bottom) * opts.avg / max;
    svg += `<line class="ch-avg" x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
  }
  return svg + '</svg>';
}

function renderStats() {
  const list = monthEntries(view.y, view.m);
  const exp = list.filter(isExp);
  const total = sumDisp(exp), incTotal = sumDisp(list.filter(isInc));
  $('stExp').textContent = money(total, cfg.display);
  $('stInc').textContent = money(incTotal, cfg.display);
  $('stBal').textContent = money(incTotal - total, cfg.display);

  // порівняння з тим самим періодом минулого місяця
  const t = today();
  const isCur = t.startsWith(ymOf(view.y, view.m));
  const daysIn = new Date(view.y, view.m + 1, 0).getDate();
  const upTo = isCur ? +t.slice(8) : daysIn;
  const pm = view.m === 0 ? { y: view.y - 1, m: 11 } : { y: view.y, m: view.m - 1 };
  const prevDays = new Date(pm.y, pm.m + 1, 0).getDate();
  const prevExp = monthEntries(pm.y, pm.m).filter(e => isExp(e) && +e.d.slice(8) <= (isCur ? upTo : prevDays));
  const prevTotal = sumDisp(prevExp);
  const cmp = $('cmp');
  if (!prevTotal) cmp.innerHTML = `<div class="arrow">–</div><div class="muted">${T.noPrev}</div>`;
  else {
    const diff = Math.round((total - prevTotal) / prevTotal * 100);
    const mName = T.monthsIn[pm.m];
    const txt = Math.abs(diff) < 3 ? T.cmpSame(mName) : diff > 0 ? T.cmpMore(diff, mName) : T.cmpLess(-diff, mName);
    cmp.innerHTML = `<div class="arrow ${Math.abs(diff) < 3 ? '' : diff > 0 ? 'up' : 'down'}">${Math.abs(diff) < 3 ? '≈' : diff > 0 ? '↑' : '↓'}</div>
      <div><div style="font-weight:600;font-size:14px">${txt}</div><div class="muted">${T.cmpPrev(money(prevTotal, cfg.display))}</div></div>`;
  }

  // по днях
  const vals = Array(daysIn).fill(0);
  for (const e of exp) { const v = dispVal(e); if (Number.isFinite(v)) vals[+e.d.slice(8) - 1] += v; }
  const labels = vals.map((_, i) => (i === 0 || (i + 1) % 5 === 0) ? String(i + 1) : '');
  $('dayChart').innerHTML = barChart(vals, labels, i => isCur && i + 1 === upTo, { avg: total / upTo });

  // за категоріями
  const sums = {};
  for (const e of exp) { const v = dispVal(e); if (Number.isFinite(v)) sums[e.c] = (sums[e.c] || 0) + v; }
  const rows = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const byCat = $('byCat');
  byCat.innerHTML = '';
  $('byCatCard').hidden = !rows.length;
  for (const [id, sum] of rows) {
    const c = catOf(id);
    const pct = total ? Math.round(sum / total * 100) : 0;
    const pos = `clamp(13px, ${pct}%, calc(100% - 13px))`;
    const lim = extra.budget.cats[id] > 0 ? `<small>${T.ofBudget(money(budgetAmt(extra.budget.cats[id]), cfg.display))}</small>` : '';
    const el = document.createElement('div');
    el.className = 'bar';
    el.innerHTML = `<div class="top-row"><span class="av" style="background:${catColor(c)}">${c.ico}</span>
        <span class="nm">${esc(catName(id))}<small>${pct}%</small></span><b>${money(sum, cfg.display)}${lim}</b></div>
      <div class="slider"><div class="fill" style="width:${pos};background-color:${catColor(c)}"></div><span class="knob" style="left:${pos}"></span></div>`;
    byCat.appendChild(el);
  }

  // останні 6 місяців
  const mv = [], ml = [];
  for (let k = 5; k >= 0; k--) {
    let y = view.y, m = view.m - k;
    while (m < 0) { m += 12; y--; }
    mv.push(sumDisp(monthEntries(y, m).filter(isExp)));
    ml.push(T.monthsShort[m]);
  }
  $('monthChart').innerHTML = barChart(mv, ml, i => i === 5, { vals: true, wide: true, h: 140 });
}

/* ---------- Друзі ---------- */
function balances() {
  const bal = {}; // ім'я → { валюта: сума } (додатне — тобі винні)
  const add = (p, cur, v) => { bal[p] = bal[p] || {}; bal[p][cur] = round2((bal[p][cur] || 0) + v); };
  for (const e of items) {
    const cur = e.cur || 'UAH';
    if (e.sp) {
      const share = e.my;
      if (e.sp.by === 'me') e.sp.w.forEach(p => add(p, cur, share));
      else add(e.sp.by, cur, -share);
    } else if (e.t === 'set') add(e.p, cur, -e.a);
  }
  for (const p of extra.people) bal[p] = bal[p] || {};
  return bal;
}
function balText(curMap) {
  return Object.entries(curMap).filter(([, v]) => Math.abs(v) >= 0.01).map(([c, v]) => money(Math.abs(v), c)).join(' + ');
}
function renderFriends() {
  const bal = balances();
  let owed = 0, owe = 0;
  for (const curMap of Object.values(bal)) for (const [c, v] of Object.entries(curMap)) {
    const d = toDisp(Math.abs(v), c);
    if (!Number.isFinite(d)) continue;
    if (v > 0) owed += d; else owe += d;
  }
  $('frOwed').textContent = money(owed, cfg.display);
  $('frOwe').textContent = money(owe, cfg.display);

  const box = $('people');
  box.innerHTML = '';
  const names = Object.keys(bal).filter(p => items.some(e => (e.sp && (e.sp.by === p || e.sp.w.includes(p))) || e.p === p));
  if (!names.length) { box.innerHTML = `<div class="empty"><div class="ring">👥</div>${T.friendsEmpty}</div>`; return; }
  names.sort((a, b) => Object.keys(bal[b]).length - Object.keys(bal[a]).length || a.localeCompare(b));
  names.forEach((name, idx) => {
    const curMap = bal[name];
    const pos = Object.fromEntries(Object.entries(curMap).filter(([, v]) => v >= 0.01));
    const neg = Object.fromEntries(Object.entries(curMap).filter(([, v]) => v <= -0.01));
    const lines = [];
    if (Object.keys(pos).length) lines.push(`<span class="pos">${T.owesYou(balText(pos))}</span>`);
    if (Object.keys(neg).length) lines.push(`<span class="neg">${T.youOweTo(balText(neg))}</span>`);
    const open = Object.keys(pos).length || Object.keys(neg).length;
    const el = document.createElement('div');
    el.className = 'person';
    const color = PERSON_COLORS[[...name].reduce((s, ch) => s + ch.charCodeAt(0), 0) % PERSON_COLORS.length];
    el.innerHTML = `<div class="p-top"><span class="avatar" style="background:${color}">${esc(name[0].toUpperCase())}</span>
      <div class="p-info"><div>${esc(name)}</div><div>${open ? lines.join('<br>') : `<span class="muted">${T.allSettled}</span>`}</div></div>
      <button class="ibtn" data-toggle>${openPerson === name ? '▴' : '▾'}</button></div>`;
    if (open) {

/* ---------- Рахунки ---------- */
const convTo = (v, from, to) => (from || 'UAH') === to ? v : v * rates[from || 'UAH'] / rates[to];
function defaultAcc() {
  const accs = extra.accounts || [];
  return accs.some(a => a.id === cfg.lastAcc) ? cfg.lastAcc : (accs[0] ? accs[0].id : '');
}
// баланс рахунку в його валюті
function accBalance(acc) {
  let b = acc.start || 0;
  const add = (v, cur) => { const x = convTo(v, cur, acc.cur); if (Number.isFinite(x)) b += x; };
  for (const e of items) {
    if (e.t === 'tr') {
      if (e.from === acc.id) add(-e.a, e.cur);
      if (e.to === acc.id) add(e.a2 ?? e.a, e.cur2 || e.cur);
      continue;
    }
    if (e.acc !== acc.id) continue;
    if (e.t === 'inc') add(e.a, e.cur);
    else if (e.t === 'goal') add(-e.a, e.cur);
    else if (!e.t && (!e.sp || e.sp.by === 'me')) add(-e.a, e.cur); // за спільну витрату, яку оплатив друг, з рахунку нічого не списано
  }
  return round2(b);
}

function firstGrapheme(str) {

// коди торговців (MCC) → категорії
const MCC_MAP = new Map([
  ['food', [5411, 5412, 5422, 5441, 5451, 5462, 5499, 5811, 5812, 5813, 5814]],
  ['trans', [4111, 4112, 4121, 4131, 4511, 4784, 4789, 5172, 5541, 5542, 5983, 7523]],
  ['health', [5122, 5912, 5975, 5976, 7997, 8011, 8021, 8031, 8041, 8042, 8043, 8049, 8050, 8062, 8071, 8099]],
  ['clothes', [5137, 5139, 5611, 5621, 5631, 5641, 5651, 5655, 5661, 5681, 5691, 5697, 5698, 5699, 5948]],
  ['phone', [4812, 4814, 4816]],
  ['fun', [4899, 5733, 5735, 5815, 5816, 5817, 5818, 5945, 7832, 7841, 7922, 7929, 7932, 7933, 7941, 7991, 7992, 7993, 7994, 7996, 7998, 7999]],
  ['home', [1520, 4900, 5039, 5200, 5211, 5251, 5261, 5712, 5719, 5722, 6513, 7349]],
].flatMap(([c, list]) => list.map(m => [m, c])));
let monoBusy = false;
let monoPending = null; // відповідь client-info, поки користувач вибирає картки
let monoStatus = null;  // { text, err }

async function monoGet(path, token) {
  let res;
  try { res = await fetch(MONO_API + path, { headers: { 'X-Token': token } }); } catch { throw new Error('net'); }
  if (res.status === 429) throw new Error('rate');
  if (res.status === 401 || res.status === 403) throw new Error('token');
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(/token/i.test(data.errorDescription || '') ? 'token' : 'net');
  return data;
}
const monoErr = e => e.message === 'rate' ? T.monoRate : e.message === 'token' ? T.monoBadToken : T.monoNet;
function monoCat(tx) {
  const text = tx.description || '';
  if (tx.amount > 0) return /кешбек|cashback|повернення|refund/i.test(text) ? 'refund' : /зарплат|заробітн|salary/i.test(text) ? 'salary' : 'inc_other';
  const mer = merchantFrom(text);
  if (mer) return mer.cat;
  return MCC_MAP.get(tx.mcc) || MCC_MAP.get(tx.originalMcc) || bankCat(text) || 'other';
}
const monoCardName = a => `${T.monoTypes[a.type] || a.type || ''} ${(a.maskedPan && a.maskedPan[0] || '').slice(-4) ? '•' + a.maskedPan[0].slice(-4) : ''}`.trim();

async function monoConnect() {
  const token = $('monoToken').value.trim();
  if (token.length < 20) { haptic('error'); monoStatus = { text: T.monoBadToken, err: true }; renderMonoSettings(); return; }
  monoStatus = { text: T.monoChecking };
  renderMonoSettings();
  try {
    const info = await monoGet('/personal/client-info', token);
    const accs = (info.accounts || []).filter(a => MONO_CUR[a.currencyCode]);
    monoPending = { token, name: info.name || 'monobank', accs };
    monoStatus = null;
  } catch (e) { monoStatus = { text: monoErr(e), err: true }; haptic('error'); }
  renderMonoSettings();
}
function monoSave() {
  const chosen = monoPending.accs.filter((a, i) => $('mc' + i).checked);
  if (!chosen.length) { haptic('error'); toast(T.monoPick); return; }
  const now = Math.floor(Date.now() / 1000);
  const from = $('monoBack').checked ? now - 30 * 86400 : now - 3600;
  extra.accounts = extra.accounts || [];
  const links = chosen.map(a => {
    const cur = MONO_CUR[a.currencyCode];
    let local = extra.accounts.find(x => x.monoId === a.id);
    if (!local) {
      local = { id: uid(), name: `monobank ${monoCardName(a)}`.trim(), ico: '🐈‍⬛', cur, start: round2(a.balance / 100), monoId: a.id };
      extra.accounts.push(local);
    }
    return { id: a.id, acc: local.id, cur, last: from };
  });

  monoPending = null;

// одна виписка за раз (ліміт monobank — 1 запит на хвилину); кілька карток оновлюються по черзі
async function monoSync(manual) {
  const m = extra.mono;
  if (!m || !m.links.length || monoBusy || !loaded) return;
  const nowS = Math.floor(Date.now() / 1000);
  const wait = 61 - (nowS - (m.lastSync || 0));
  if (wait > 0) { if (manual) toast(T.monoWait(wait)); return; }
  monoBusy = true;
  const link = m.links[(m.rr || 0) % m.links.length];
  m.rr = (m.rr || 0) + 1;
  m.lastSync = nowS;
  try {
    const from = Math.max(link.last - 3600, nowS - 31 * 86400 + 60);
    const txs = await monoGet(`/personal/statement/${link.id}/${from}/${nowS}`, m.token);
    const seen = new Set([...items.filter(e => e.mono).map(e => e.mono), ...(m.skip || [])]);
    let added = 0, latest = null;
    for (const tx of txs) {
      if (!latest || tx.time > latest.time) latest = tx;
      if (seen.has(tx.id) || !tx.amount) continue;
      const dt = new Date(tx.time * 1000);
      const e = { id: uid(), a: round2(Math.abs(tx.amount) / 100), cur: link.cur, c: monoCat(tx), n: (tx.description || '').replace(/\s+/g, ' ').trim().slice(0, 80), d: iso(dt.getFullYear(), dt.getMonth(), dt.getDate()), acc: link.acc, mono: tx.id };
      if (tx.amount > 0) e.t = 'inc';
      items.push(e);
      added++;
    }
    link.last = nowS;
    // підганяємо баланс рахунку під справжній баланс картки
    const acc = latest && (extra.accounts || []).find(a => a.id === link.acc);
    if (acc) acc.start = round2(acc.start + latest.balance / 100 - accBalance(acc));
    m.err = '';
    if (added) persist();
    persistExtra();
    if (added) { haptic('success'); toast(T.monoAdded(added)); render(); }
    else if (manual) toast(T.monoNone);
  } catch (err) {
    m.err = monoErr(err);
    persistExtra();
    if (manual) toast(m.err);
  } finally {
    monoBusy = false;
    if (page === 'settings') renderMonoSettings();
  }
}

let goalForm = false;      // відкрита форма нової цілі

const goalSaved = g => round2(items.filter(e => e.t === 'goal' && e.g === g.id).reduce((s, e) => s + e.a, 0));
function monthsUntil(dateStr) {
  const now = new Date(), d = new Date(dateStr + 'T12:00');
  return (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth() + (d.getDate() >= now.getDate() ? 0 : -1) + 1;
}
function renderGoals() {
  const card = $('goalCard');

  let html = `<h2><span>${T.goals}</span><button class="chip-btn ghost" id="goalNewBtn">${goalForm ? T.cancel : T.goalNew}</button></h2>`;
  if (!goals.length && !goalForm) html += `<div class="muted">${T.goalCta}</div>`;
  if (goalForm) {
    html += `<div class="inline-form" style="margin:0 0 12px">
      <div class="row"><input id="gIco" value="🎯" maxlength="8" style="flex:0 0 56px;text-align:center"><input id="gName" maxlength="30" placeholder="${esc(T.goalNamePh)}"></div>

      <div class="row"><input id="gDate" type="date" min="${today()}" title="${esc(T.goalDeadline)}"></div>
      <div class="muted" style="margin-top:4px;font-size:11px">${T.goalDeadline}</div>
      <button class="btn" id="gCreate" style="margin-top:10px">${T.goalCreate}</button></div>`;
  }
  for (const g of goals) {
    const saved = goalSaved(g);
    const pct = g.target > 0 ? Math.min(100, saved / g.target * 100) : 0;
    const left = round2(g.target - saved);
    let note;
    if (left <= 0) note = T.goalDone;
    else if (g.deadline) {
      const mLeft = monthsUntil(g.deadline);
      note = g.deadline < today() ? `${T.goalOverdue(fmtDay(g.deadline))} · ${T.goalLeft(money(left, g.cur))}` : T.goalNeed(money(left / Math.max(1, mLeft), g.cur), fmtDay(g.deadline));
    } else note = T.goalLeft(money(left, g.cur));
    const act = goalAction && goalAction.id === g.id;
    const accs = extra.accounts || [];
    html += `<div class="goal" data-g="${g.id}">
      <div class="g-top"><span class="g-ico">${esc(g.ico)}</span><div class="g-info"><div>${esc(g.name)}</div><div>${money(saved, g.cur)} / ${money(g.target, g.cur)}</div></div><span class="g-pct">${Math.floor(pct)}%</span></div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="g-note">${note}</div>
      ${act ? `<div class="inline-form"><div class="row"><div class="money-in"><input class="gAmt" type="text" inputmode="decimal" placeholder="${T.zero}"><span>${SYM[g.cur]}</span></div>
          ${accs.length ? `<select class="gAcc"><option value="">${esc(T.noAcc)}</option>${accs.map(a => `<option value="${a.id}"${a.id === defaultAcc() ? ' selected' : ''}>${esc(a.ico + ' ' + a.name)}</option>`).join('')}</select>` : ''}</div>
          <button class="btn gOk" style="margin-top:10px">${goalAction.sign > 0 ? T.deposit : T.withdraw}</button></div>` : ''}
      <div class="g-acts"><button class="chip-btn" data-dep>${T.deposit}</button><button class="chip-btn ghost" data-wd>${T.withdraw}</button><button class="chip-btn ghost x" data-del aria-label="Delete">✕</button></div>
    </div>`;
  }
  card.innerHTML = html;

  $('goalNewBtn').onclick = () => { tick(); goalForm = !goalForm; renderGoals(); if (goalForm) $('gName').focus(); };
  if (goalForm) $('gCreate').onclick = () => {
    const name = $('gName').value.trim(), target = parseAmount($('gTarget').value);
    if (!name || !(target > 0)) { haptic('error'); toast(T.goalNeedName); return; }
    extra.goals = extra.goals || [];
    extra.goals.push({ id: uid(), name, ico: firstGrapheme($('gIco').value) || '🎯', target, cur: $('gCur').value, deadline: $('gDate').value || '' });
    persistExtra(); goalForm = false; haptic('success'); toast(T.goalSaved); renderGoals();
  };
  card.querySelectorAll('.goal').forEach(el => {
    const g = goals.find(x => x.id === el.dataset.g);
    el.querySelector('[data-dep]').onclick = () => { tick(); goalAction = goalAction && goalAction.id === g.id && goalAction.sign > 0 ? null : { id: g.id, sign: 1 }; renderGoals(); focusGoal(); };
    el.querySelector('[data-wd]').onclick = () => { tick(); goalAction = goalAction && goalAction.id === g.id && goalAction.sign < 0 ? null : { id: g.id, sign: -1 }; renderGoals(); focusGoal(); };
    el.querySelector('[data-del]').onclick = async () => {
      if (!(await confirmMsg(T.goalDelQ(g.name)))) return;
      extra.goals = extra.goals.filter(x => x !== g);
      items = items.filter(e => !(e.t === 'goal' && e.g === g.id));
      persist(); persistExtra(); renderGoals(); renderAccounts();
    };
    const ok = el.querySelector('.gOk');
    if (ok) ok.onclick = () => {
      const v = parseAmount(el.querySelector('.gAmt').value);
      if (!(v > 0)) { haptic('error'); toast(T.badAmount); return; }
      const e = { id: uid(), t: 'goal', g: g.id, a: round2(goalAction.sign * v), cur: g.cur, d: today() };
      const acc = el.querySelector('.gAcc');
      if (acc && acc.value) e.acc = acc.value;
      items.push(e);
      persist(); goalAction = null; haptic('success');
      toast(goalSaved(g) >= g.target ? T.goalDone : T.goalSaved);
      renderGoals(); renderAccounts();
    };
  });
}

let pickTarget = 'bg';
let hsv = { h: 0, s: 0, v: 0 };
function syncPicker() {

function drawPicker() {
  const hex = cfg.custom[pickTarget];
  $('sv').style.backgroundColor = rgbToHex(...hsvToRgb(hsv.h, 1, 1));
  Object.assign($('svKnob').style, { left: hsv.s * 100 + '%', top: (1 - hsv.v) * 100 + '%', background: hex });
  Object.assign($('hueKnob').style, { left: hsv.h / 360 * 100 + '%', background: rgbToHex(...hsvToRgb(hsv.h, 1, 1)) });
  $('pickPrev').style.background = hex;
  if (document.activeElement !== $('hexIn')) $('hexIn').value = hex.toUpperCase();
  const sw = $('customSw');

}
function setColor(hex) {

function draggable(el, onMove) {
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    try { tg.disableVerticalSwipes(); } catch {}
    onMove(e);
    const move = ev => onMove(ev);
    const up = () => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      try { tg.enableVerticalSwipes(); } catch {}
      saveCfg();
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
}
draggable($('sv'), e => {
  const r = $('sv').getBoundingClientRect();
  hsv.s = clamp01((e.clientX - r.left) / r.width);
  hsv.v = 1 - clamp01((e.clientY - r.top) / r.height);
  setColor(rgbToHex(...hsvToRgb(hsv.h, hsv.s, hsv.v)));
});
draggable($('hue'), e => {
  const r = $('hue').getBoundingClientRect();
  hsv.h = Math.min(359.9, clamp01((e.clientX - r.left) / r.width) * 360);
  setColor(rgbToHex(...hsvToRgb(hsv.h, hsv.s, hsv.v)));
});
$('hexIn').addEventListener('input', () => {
  const m = $('hexIn').value.trim().match(/^#?([0-9a-f]{6})$/i);
  if (!m) return;
  const hex = '#' + m[1].toLowerCase();
  hsv = rgbToHsv(...hexToRgb(hex));
  setColor(hex);
  saveCfg();
});
$('hexIn').addEventListener('blur', drawPicker);

function budgetState(ym) {
  const [y, m] = ym.split('-').map(Number);
  const exp = monthEntries(y, m - 1).filter(isExp);
  const res = { total: sumDisp(exp), cats: {} };
  for (const id of Object.keys(extra.budget.cats)) res.cats[id] = sumDisp(exp.filter(e => e.c === id));
  return res;
}
function budgetWarnings(before, after) {
  const check = (b, a, lim, name) => {
    if (!(lim > 0)) return null;
    const L = budgetAmt(lim);
    if (a >= L && b < L) return T.warnOver(name);
    if (a >= L * 0.8 && b < L * 0.8) return T.warn80(name);
    return null;
  };
  const msgs = [check(before.total, after.total, extra.budget.total, T.totalBudget)];

const CAT_STEMS = Object.entries(CAT_WORDS).flatMap(([id, words]) => words.split(' ').map(st => [st, id]));
const INC_STEMS = Object.entries(INC_WORDS).flatMap(([id, words]) => words.split(' ').map(st => [st, id]));
const DATE_WORDS = [[/^(сьогодні|сегодня|today)$/, 0], [/^(вчора|вчера|yesterday)$/, -1], [/^(позавчора|позавчера)$/, -2]];
const FILLER = /^(за|на|в|у|і|и|й|та|and|for|on|the|a|an|i|я|витратив|витратила|потратил|потратила|spent|купив|купила|купил|bought|paid|заплатив|заплатил|коштувало|стоило|cost|грошей|денег|money|of)$/;

function parseSpoken(text) {
  const norm = text.toLowerCase().replace(/[’ʼ`]/g, "'")
    .replace(/(\d)\s*[,.]\s*(\d)/g, '$1.$2')
    .replace(/([$€₴])/g, ' $1 ')
    .replace(/(\d)(k)\b/g, '$1 $2')
    .replace(/(\d)([a-zа-яіїєґ]+)/g, '$1 $2');
  const tokens = norm.replace(/\.(?!\d)/g, ' ').split(/[\s!?;:()"«»]+|,\s*/).filter(Boolean);
  const used = new Array(tokens.length).fill(false);
  let amount = null, cur = null, cat = null, incCat = null, shift = null, income = false;
  const isNum = w => /^\d+(\.\d+)?$/.test(w) || NUM_WORDS[w] !== undefined;
  for (let i = 0; i < tokens.length && amount === null; i++) {
    if (!isNum(tokens[i])) continue;
    let total = 0, part = 0, j = i;
    for (; j < tokens.length; j++) {
      const w = tokens[j];
      if (/^\d+(\.\d+)?$/.test(w)) part += parseFloat(w);
      else if (NUM_WORDS[w] !== undefined) part += NUM_WORDS[w];
      else if (isHundred(w)) part = (part || 1) * 100;
      else if (isThousand(w)) { total += (part || 1) * 1000; part = 0; }
      else if (w === 'and' && j + 1 < tokens.length && isNum(tokens[j + 1])) continue;
      else break;
      used[j] = true;
    }
    amount = total + part;
    i = j;
  }
  tokens.forEach((w, i) => {
    if (used[i]) return;
    const c = CUR_WORDS.find(([, re]) => re.test(w));
    if (c) { if (!cur) cur = c[0]; used[i] = true; return; }
    const d = DATE_WORDS.find(([re]) => re.test(w));
    if (d) { shift = d[1]; used[i] = true; return; }
    if (INC_VERBS.test(w)) { income = true; used[i] = true; return; }
    if (!incCat) { const hit = INC_STEMS.find(([st]) => w.startsWith(st)); if (hit) incCat = hit[1]; }
    if (!cat) { const hit = CAT_STEMS.find(([st]) => w.startsWith(st)); if (hit) cat = hit[1]; }
  });
  if (/day before yesterday/.test(norm)) { shift = -2; tokens.forEach((w, i) => { if (/^(day|before|yesterday)$/.test(w)) used[i] = true; }); }
  if (incCat && (income || !cat)) income = true;
  const note = tokens.filter((w, i) => !used[i] && !FILLER.test(w)).join(' ');
  return { amount, cur, cat: income ? (incCat || 'inc_other') : cat, income, shift, note: note ? note[0].toUpperCase() + note.slice(1) : '' };
}

const VOICE_LANGS = [{ id: 'uk-UA', label: 'УКР' }, { id: 'ru-RU', label: 'РУС' }, { id: 'en-US', label: 'ENG' }];

function stopListening() { if (rec) { try { rec.stop(); } catch {} } }
function startListening() {
  if (!SR) { setHint(T.noSR); $('quick').focus(); return; }
  if (rec) { stopListening(); return; }
  rec = new SR();
  rec.lang = cfg.voiceLang || (cfg.lang === 'en' ? 'en-US' : 'uk-UA');
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let finalText = '';
  rec.onstart = () => { $('mic').classList.add('on'); setHint(T.listening); haptic('success'); };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    $('quick').value = (finalText + interim).trim();
  };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') setHint(T.micDenied, 'err');
    else if (e.error === 'no-speech') setHint(T.noSpeech, 'err');
    else if (e.error !== 'aborted') setHint(T.noSR);
  };
  rec.onend = () => {
    $('mic').classList.remove('on');
    rec = null;
    const text = $('quick').value.trim();
    if (text) applySpoken(text);
    else if ($('vhint').textContent === T.listening) setHint('');
  };
  try { rec.start(); } catch { rec = null; setHint(T.noSR); }
}

let tessLoading = null;
function loadTesseract() {

  return tessLoading || (tessLoading = new Promise((res, rej) => {

    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

// готуємо зображення: розмір ~1600px, ч/б, контраст; темні скриншоти (нічний режим банку) інвертуємо
function prepareImage(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(2, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      let sum = 0, n = 0;
      const data = ctx.getImageData(0, 0, c.width, c.height).data;
      for (let i = 0; i < data.length; i += 4 * 97) { sum += data[i] * .3 + data[i + 1] * .59 + data[i + 2] * .11; n++; }
      const dark = sum / n < 110;
      ctx.filter = `${dark ? 'invert(1) ' : ''}grayscale(1) contrast(1.35)`;
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

const CUR_RE = '(₴|грн\\.?|uah|\\$|usd|€|eur|zł|zl|pln|kč|kc|czk)';
const NUM_RE = '(\\d{1,3}(?:[ \\u00a0\\u202f]\\d{3})+|\\d+)(?:[.,](\\d{2}))?';
const curOf = t => { t = (t || '').toLowerCase(); return /₴|грн|uah/.test(t) ? 'UAH' : /\$|usd/.test(t) ? 'USD' : /€|eur/.test(t) ? 'EUR' : /zł|zl|pln/.test(t) ? 'PLN' : /kč|kc|czk/.test(t) ? 'CZK' : null; };
const toNum = (int, dec) => parseFloat(int.replace(/[   ]/g, '') + (dec ? '.' + dec : ''));

// усі суми в рядку: знак, число, валюта (валюта може стояти до або після числа)
function moneyTokens(line) {
  const out = [];
  const after = new RegExp(`([−\\-–+])?\\s?${NUM_RE}\\s?${CUR_RE}`, 'gi');
  const before = new RegExp(`([−\\-–+])?\\s?([$€])\\s?${NUM_RE}`, 'gi');
  for (const m of line.matchAll(after)) out.push({ sign: m[1] || '', v: toNum(m[2], m[3]), cur: curOf(m[4]), idx: m.index });
  for (const m of line.matchAll(before)) out.push({ sign: m[1] || '', v: toNum(m[3], m[4]), cur: curOf(m[2]), idx: m.index });
  // розпізнавання часто губить «₴» або читає його як «2» — тож «-185,00» зі знаком теж сума
  const signed = /([−\-–+])\s?(\d{1,3}(?:[   ]\d{3})+|\d+)[.,](\d{2})(?!\d)/g;
  for (const m of line.matchAll(signed)) if (!out.some(t => Math.abs(t.idx - m.index) < 3)) out.push({ sign: m[1], v: toNum(m[2], m[3]), cur: null, idx: m.index });
  return out.filter(t => t.v > 0 && t.v < 1e7).sort((a, b) => a.idx - b.idx);
}
function merchantFrom(text) {
  for (const [re, cat, name] of MERCHANTS) if (re.test(text)) return { name, cat };
  return null;
}
function bankCat(text) {
  for (const [re, cat] of BANK_CATS) if (re.test(text)) return cat;
  const counts = {};
  for (const w of text.toLowerCase().split(/[^a-zа-яіїєґ']+/)) {
    const hit = w.length > 2 && CAT_STEMS.find(([st]) => w.startsWith(st));
    if (hit) counts[hit[1]] = (counts[hit[1]] || 0) + 1;
  }
  const best = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  return best ? best[0] : null;
}
const UA_MONTHS = ['січ', 'лют', 'бер', 'квіт', 'трав', 'черв', 'лип', 'серп', 'вер', 'жовт', 'лист', 'груд'];
const EN_MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
function findDate(text) {
  const t = text.toLowerCase();
  const ok = d => d && d <= today() ? d : null;
  let m = t.match(/(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4}|\d{2})/);
  if (m && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31) return ok(iso(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2] - 1, +m[1]));
  m = t.match(/(\d{1,2})\s+([а-яіїєґa-z]{3,})\.?(?:\s+(\d{4}))?/);
  if (m) {
    let mi = UA_MONTHS.findIndex(x => m[2].startsWith(x));
    if (mi < 0) mi = EN_MONTHS.findIndex(x => m[2].startsWith(x));
    if (mi >= 0 && +m[1] <= 31) return ok(iso(m[3] ? +m[3] : new Date().getFullYear(), mi, +m[1]));
  }
  m = t.match(/\b([a-z]{3,})\.?\s+(\d{1,2}),?(?:\s+(\d{4}))?/); // «Oct 14, 2026»
  if (m) {
    const mi = EN_MONTHS.findIndex(x => m[1].startsWith(x));
    if (mi >= 0 && +m[2] <= 31) return ok(iso(m[3] ? +m[3] : new Date().getFullYear(), mi, +m[2]));
  }
  const d = new Date();
  if (/(сьогодні|сегодня|today)/.test(t)) return today();
  if (/(вчора|вчера|yesterday)/.test(t)) { d.setDate(d.getDate() - 1); return iso(d.getFullYear(), d.getMonth(), d.getDate()); }
  return null;
}
// назва з рядка операції: прибираємо суму, час, зайві символи
function cleanName(s) {
  return s.replace(/[−\-–+]?\s?\d[\d   ]*(?:[.,]\d{2})?\s?(₴|грн\.?|uah|\$|usd|€|eur|zł|pln|kč|czk)?/gi, ' ')
    .replace(/\b\d{1,2}:\d{2}\b/g, ' ').replace(/[|©®™•·>«»"“”_=~*#]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
}

function analyzeImageText(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const all = lines.join('\n');

  // 1) список операцій (виписка): кілька рядків «назва … −сума»
  const rows = [];
  for (const line of lines) {
    if (NOISE_LINE.test(line)) continue;
    const toks = moneyTokens(line).filter(t => t.sign);
    const name = cleanName(line);
    if (toks.length && /[a-zа-яіїєґ]{3,}/i.test(name)) {
      const tk = toks[toks.length - 1];
      const income = tk.sign === '+';
      const mer = merchantFrom(line);
      rows.push({ amount: tk.v, cur: tk.cur, income, name: mer ? mer.name : name, cat: income ? (bankCat(line) && INC_CATS.some(c => c.id === bankCat(line)) ? bankCat(line) : 'inc_other') : (mer ? mer.cat : bankCat(line) || 'other') });
    }
  }
  if (rows.length >= 2) return { multi: rows, date: findDate(all) };

  // 2) одна операція або чек
  const income = INCOME_WORDS.test(all) && !PAY_WORDS.test(all.split('\n').slice(0, 4).join(' '));
  let pick = null;
  const strong = /(до\s*сплати|к\s*оплате|сума|сумма|всього|разом|итого|total|amount)/i;
  for (let i = 0; i < lines.length && !pick; i++) {
    if (!strong.test(lines[i]) || NOISE_LINE.test(lines[i])) continue;
    const toks = moneyTokens(lines[i]).concat(i + 1 < lines.length ? moneyTokens(lines[i + 1]) : []);
    if (toks.length) pick = toks.sort((a, b) => b.v - a.v)[0];
    else {
      const nums = [...lines[i].matchAll(/(\d{1,3}(?:[  ]\d{3})+|\d+)[.,](\d{2})(?!\d)/g)].map(m => ({ v: toNum(m[1], m[2]), cur: null, sign: '' }));
      if (nums.length) pick = nums.sort((a, b) => b.v - a.v)[0];
    }
  }
  if (!pick) {
    const cands = [];
    lines.forEach((l, i) => { if (!NOISE_LINE.test(l)) moneyTokens(l).forEach(t => cands.push({ ...t, line: i })); });
    // скриншот оплати: головна сума зазвичай угорі й часто зі знаком
    pick = cands.find(t => t.sign) || cands[0] || null;
  }
  if (!pick) {
    const nums = lines.filter(l => !NOISE_LINE.test(l)).flatMap(l => [...l.matchAll(/(\d{1,3}(?:[  ]\d{3})+|\d+)[.,](\d{2})(?!\d)/g)]).map(m => toNum(m[1], m[2]));
    if (nums.length) pick = { v: Math.max(...nums), cur: null, sign: '' };
  }
  if (!pick) return null;

  // куди пішли гроші: рядок «Отримувач/Кому/Магазин…», відомий бренд або перший змістовний рядок
  let name = '';
  const mer = merchantFrom(all);
  for (let i = 0; i < lines.length && !name; i++) {
    if (!RECIPIENT.test(lines[i])) continue;
    const after = lines[i].split(/[:：]/).slice(1).join(':').trim();
    name = cleanName(after || lines[i + 1] || '');
  }
  if (!name && mer) name = mer.name;
  if (!name) {
    const cand = lines.find(l => /[a-zа-яіїєґ]{3,}/i.test(l) && !NOISE_LINE.test(l) && !PAY_WORDS.test(l) && !INCOME_WORDS.test(l) && !strong.test(l) && !/\d{1,2}:\d{2}|чек|receipt|успішн|success|готово|done/i.test(l));
    if (cand) name = cleanName(cand);
  }
  const isInc = pick.sign === '+' || (income && pick.sign !== '−' && pick.sign !== '-');
  let cat;
  if (isInc) cat = /зарплат|salary/i.test(all) ? 'salary' : /кешбек|cashback|повернення|refund/i.test(all) ? 'refund' : 'inc_other';
  else cat = (mer && mer.cat) || bankCat(all) || 'other';
  return { amount: pick.v, cur: pick.cur, income: isInc, name, cat, date: findDate(all) };
}

let multiRows = [];
function renderMulti() {
  const box = $('multiBox');
  box.hidden = !multiRows.length;
  if (!multiRows.length) { box.innerHTML = ''; return; }
  const sel = multiRows.filter(r => r.on).length;
  box.innerHTML = `<div class="mt">${T.scanMulti(multiRows.length)}</div>` + multiRows.map((r, i) => {
    const c = catOf(r.cat);
    return `<label class="mrow"><input type="checkbox" data-i="${i}" ${r.on ? 'checked' : ''}>
      <span class="ico" style="background:${catColor(c)}">${c.ico}</span>
      <span class="grow"><div>${esc(r.name)}</div><div>${esc(catName(r.cat))}</div></span>
      <b class="${r.income ? 'inc' : ''}">${r.income ? '+' : '−'}${money(r.amount, r.cur || form.cur)}</b></label>`;
  }).join('') + `<button class="btn" id="multiAdd" ${sel ? '' : 'disabled'}>${T.addSelected(sel)}</button>`;
  box.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => { multiRows[+cb.dataset.i].on = cb.checked; renderMulti(); });
  $('multiAdd').onclick = () => {
    const d = $('date').value || today();
    const chosen = multiRows.filter(r => r.on);
    for (const r of chosen) {
      const e = { id: uid(), a: round2(r.amount), cur: r.cur || form.cur, c: r.cat, n: r.name, d };
      if (form.acc) e.acc = form.acc;
      if (r.income) e.t = 'inc';
      items.push(e);
    }
    persist();
    multiRows = [];
    closeForm();
    const [y, m] = d.split('-').map(Number);
    view = { y, m: m - 1 };
    haptic('success');
    toast(T.addedN(chosen.length));
    render();
  };
}

async function scanReceipt(file) {
  setHint(T.scanLoading);
  multiRows = []; renderMulti();
  $('scanBtn').disabled = true;
  try {
    await loadTesseract();
    const worker = await Tesseract.createWorker(['ukr', 'eng'], 1, {
      logger: m => { if (m.status === 'recognizing text') setHint(T.scanning(Math.round(m.progress * 100))); },
    });
    const { data: { text } } = await worker.recognize(await prepareImage(file));
    await worker.terminate();
    const r = analyzeImageText(text);
    if (!r) { setHint(T.scanFail, 'err'); haptic('error'); return; }
    if (r.date) $('date').value = r.date;
    if (r.multi) {
      multiRows = r.multi.map(x => ({ ...x, on: true }));
      setHint('');
      renderMulti();
      haptic('success');
      return;
    }
    form.t = r.income ? 'inc' : 'exp';
    form.cat = r.cat;
    form.cur = r.cur || cfg.input;
    $('amount').value = String(round2(r.amount)).replace('.', T.locale === 'uk-UA' ? ',' : '.');
    $('note').value = (r.name || T.receipt).slice(0, 80);
    renderForm();
    const a = money(r.amount, form.cur);
    setHint(r.income ? T.scanInc(a, r.name, catName(r.cat)) : T.scanPay(a, r.name, catName(r.cat)), 'ok');
    flashFields();
    haptic('success');
  } catch (err) {
    console.error(err);
    setHint(T.scanErr, 'err');
  } finally {
    $('scanBtn').disabled = false;
    $('scanFile').value = '';
  }
}
$('scanBtn').onclick = () => { tick(); $('scanFile').click(); };
$('scanFile').addEventListener('change', () => { const f = $('scanFile').files[0]; if (f) scanReceipt(f); });
// на комп'ютері скриншот можна просто вставити Ctrl+V, коли відкрита форма
document.addEventListener('paste', e => {
  if (!sheetOpen()) return;
  const f = [...(e.clipboardData && e.clipboardData.files || [])].find(x => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); scanReceipt(f); }
});

/* =====================================================================
   Профіль: ім'я й фото з Telegram, статистика
   ===================================================================== */
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const tgPhoto = tgUser && tgUser.photo_url;
const profileName = () => (tgUser && [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ')) || T.meName;
function avaHTML(size) {
  const face = tgPhoto ? `<img src="${esc(tgPhoto)}" alt="">` : esc((profileName()[0] || '?').toUpperCase());
  return `<span class="ava" style="--s:${size}px"><span class="face">${face}</span></span>`;
}
// записи, різні дні, найдовша серія днів поспіль
function profileStats() {
  const E = items.filter(isEntry);
  const days = [...new Set(E.map(e => e.d))].sort();
  let streak = 0, run = 0, prev = null;
  for (const d of days) {
    const t = new Date(d + 'T12:00');
    run = prev && (t - prev) / 864e5 < 1.5 ? run + 1 : 1;
    streak = Math.max(streak, run);
    prev = t;
  }
  return { entries: E.length, days: days.length, streak };
}
function renderProfile() {
  const st = profileStats();
  $('pcard').innerHTML = `
    <div class="banner" style="background:linear-gradient(135deg, var(--accent), var(--l2))"></div>
    <div class="pbody">
      ${avaHTML(96)}
      <div class="pname-row"><span class="pname">${esc(profileName())}</span></div>
      <div class="pstats" style="margin-top:12px">${T.pstats(st.entries, st.days, st.streak)}</div>
    </div>`;
}

/* =====================================================================
   Запуск
   ===================================================================== */
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { tick(); selectedDay = b.dataset.go === 'history' ? selectedDay : null; go(b.dataset.go); }));
$('fab').onclick = () => { tick(); openForm(null); };
$('gearBtn').onclick = () => { tick(); go('settings'); };
$('profBtn').onclick = () => { tick(); go('profile'); };
$('backBtn').onclick = () => { tick(); onBack(); };
$('prev').onclick = () => shiftMonth(-1);
$('next').onclick = () => shiftMonth(1);
$('clearDay').onclick = () => { selectedDay = null; render(); };
let searchTimer;
$('searchIn').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { hQuery = $('searchIn').value; selectedDay = null; renderHistory(); }, 150); });
try { tg.BackButton.onClick(onBack); } catch {}

// спершу — збережені на пристрої мова й тема, щоб не блимало
try {
  const ui = JSON.parse(localStorage.getItem('ui') || '{}');
  if (I18N[ui.lang]) cfg.lang = ui.lang;
  if (validCustom(ui.custom)) cfg.custom = ui.custom;
  if (THEMES[ui.theme] || ui.theme === 'custom') cfg.theme = ui.theme;
  if (ui.anim === false) cfg.anim = false;
} catch {}
const applyAnim = () => document.documentElement.classList.toggle('no-anim', cfg.anim === false);
applyAnim();
let hasUi = false;
try { hasUi = !!localStorage.getItem('ui'); } catch {}
const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
if (!hasUi && tgLang && !/^(uk|ru)/.test(tgLang)) cfg.lang = 'en';
applyLang(cfg.lang);
applyTheme(cfg.theme);
go('home');
$('fab').disabled = true;

Promise.all([loadBlob('d', 'n', 'expenses'), loadCfg(), loadBlob('x', 'xn', 'extra')])
  .then(([raw, savedCfg, rawExtra]) => {
    items = raw ? JSON.parse(raw) : [];
    if (rawExtra) {
      const x = JSON.parse(rawExtra);
      extra = { ...extra, ...x, budget: { ...extra.budget, ...(x.budget || {}), cats: { ...(x.budget && x.budget.cats || {}) } } };
    }
    if (SYM[savedCfg.display]) cfg.display = savedCfg.display;
    if (SYM[savedCfg.input]) cfg.input = savedCfg.input;
    if (savedCfg.voiceLang) cfg.voiceLang = savedCfg.voiceLang;
    if (savedCfg.anim === false) { cfg.anim = false; applyAnim(); }
    if (I18N[savedCfg.lang] && savedCfg.lang !== cfg.lang) { cfg.lang = savedCfg.lang; applyLang(cfg.lang); }
    if (validCustom(savedCfg.custom)) cfg.custom = savedCfg.custom;
    if (THEMES[savedCfg.theme] || savedCfg.theme === 'custom') cfg.theme = savedCfg.theme;
    if (!extra.budget.cur || !SYM[extra.budget.cur]) extra.budget.cur = cfg.display;
    applyTheme(cfg.theme);
    loaded = true;
    if (runRecurring()) { persist(); persistExtra(); }
    if (extra.ach || extra.stats || extra.profile) { delete extra.ach; delete extra.stats; delete extra.profile; persistExtra(); } // досягнень і оформлення профілю більше немає
    $('fab').disabled = false;
    setTimeout(() => monoSync(false), 1200);
    setInterval(() => { if (document.visibilityState === 'visible') monoSync(false); }, 65000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') monoSync(false); });
    render();
  })
  // «+» не вмикаємо, щоб випадково не перезаписати збережені дані порожнім списком
  .catch(err => { console.error(err); alertMsg(T.loadErr); });
fetchRates();
