  const orbit = (chars) => `<span class="orbit">${chars.map((c, i) => {
    const ang = i / chars.length * Math.PI * 2 - Math.PI / 2;
    return `<span style="left:${50 + 50 * Math.cos(ang)}%;top:${50 + 50 * Math.sin(ang)}%">${c}</span>`;
  }).join('')}</span>`;
  switch (id) {
    case 'f_gold': return ring('linear-gradient(135deg,#fff3b0,#f5c542,#b8860b,#f5c542,#fff3b0)');
    case 'f_diamond': return ring('linear-gradient(135deg,#e0fbff,#7fe7ff,#3fa9f5,#c9f6ff)') + deco('✦', 'top:-12%;right:-4%', 'tw') + deco('✦', 'bottom:-6%;left:-6%;animation-delay:.6s', 'tw') + deco('✧', 'top:30%;left:-16%;animation-delay:1.1s;font-size:calc(var(--s)*.22)', 'tw');
    case 'f_fire': return ring('conic-gradient(#ff3d00,#ffb300,#ff6d00,#ff1744,#ffb300,#ff3d00)', 'spin') + deco('🔥', 'bottom:-18%;left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.32)');
    case 'f_crown': return ring('linear-gradient(135deg,#fff3b0,#f5c542,#b8860b)') + deco('👑', 'top:-36%;left:50%;transform:translateX(-50%) rotate(-10deg)');
    case 'f_rainbow': return ring('conic-gradient(#ff6b6b,#feca57,#1dd1a1,#48dbfb,#5f27cd,#ff9ff3,#ff6b6b)', 'spin');
    case 'f_party': return ring('repeating-conic-gradient(#ff5d8f 0 15deg,#ffd166 15deg 30deg,#06d6a0 30deg 45deg,#4cc9f0 45deg 60deg)') + deco('🎉', 'top:-26%;right:-14%;transform:rotate(15deg)');
    case 'f_halo': return '<span class="halo"></span>' + ring('linear-gradient(#fffbe6,#fff3b0)');
    case 'f_coins': return ring('linear-gradient(135deg,#f5c542,#b8860b)') + orbit(['🪙', '🪙', '🪙']);
    case 'f_neon': return '<span class="glow"></span>' + ring('var(--accent)');
    case 'f_love': return ring('linear-gradient(135deg,#ff9ac8,#ff4f8b)') + deco('💕', 'bottom:-10%;right:-14%;font-size:calc(var(--s)*.3)') + deco('💗', 'top:-10%;left:-12%;font-size:calc(var(--s)*.24)');
    case 'f_orbit': return ring('linear-gradient(135deg,#c3b6ff,#7b6cff)') + orbit(['✨', '⭐', '✨', '💫']);
    case 'f_music': return ring('linear-gradient(#444,#111)') + deco('🎧', 'top:-34%;left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.5)');
    default: return '';
  }
}

function effectHTML(id, n = 14) {
  if (!id) return '';
  const set = { e_snow: ['❄️', '❄', '✻'], e_coins: ['🪙', '💰', '🪙'], e_hearts: ['💖', '💗', '💕'] }[id];
  const colors = ['#ff5d8f', '#ffd166', '#06d6a0', '#4cc9f0', '#b388ff'];
  let html = `<div class="fx${id === 'e_hearts' ? ' rise' : ''}">`;
  for (let i = 0; i < n; i++) {
    const left = (i * 37 + 11) % 100, dur = 3 + (i * 7) % 5, delay = -((i * 1.3) % dur), size = 10 + (i * 5) % 9;
    const st = `left:${left}%;animation-duration:${dur}s;animation-delay:${delay.toFixed(1)}s`;
    html += set ? `<span style="${st};font-size:${size}px">${set[i % set.length]}</span>` : `<i style="${st};background:${colors[i % colors.length]}"></i>`;
  }
  return html + '</div>';
}

const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const tgPhoto = tgUser && tgUser.photo_url;
function profileName() { return (extra.profile && extra.profile.name) || (tgUser && tgUser.first_name) || T.meName; }
function faceHTML(avatarId) {
  const id = avatarId || (tgPhoto ? 'a_tg' : 'a_letter');
  if (id === 'a_tg' && tgPhoto) return `<img src="${esc(tgPhoto)}" alt="">`;
  if (COS[id] && COS[id].v) return COS[id].v;
  return esc((profileName()[0] || '?').toUpperCase());
}
function avaHTML(size, over = {}) {
  const prof = extra.profile || {};
  // заблоковане (наприклад, після видалення записів) не показуємо; у прев’ю over передає предмет явно
  const p = {
    avatar: 'avatar' in over ? over.avatar : (isUnlocked(prof.avatar) ? prof.avatar : ''),
    frame: 'frame' in over ? over.frame : (isUnlocked(prof.frame) ? prof.frame : ''),
  };
  return `<span class="ava" style="--s:${size}px"><span class="face">${faceHTML(p.avatar)}</span>${frameHTML(p.frame)}</span>`;
}

const isUnlocked = cid => !!COS[cid] && (COS[cid].free || (ACH_BY_REWARD[cid] && extra.ach[ACH_BY_REWARD[cid].id]));
function bump(key) {
  extra.stats = extra.stats || {};
  extra.stats[key] = (extra.stats[key] || 0) + 1;
  persistExtra();
  checkAchievements();
}
function trackTheme(id) {
  extra.stats = extra.stats || {};
  if (id === 'custom') extra.stats.custom = 1;
  else extra.stats.themes = [...new Set([...(extra.stats.themes || []), id])];
  persistExtra();
  checkAchievements();
}
function equip(cid) {
  const c = COS[cid];
  if (!c) return;
  extra.profile = extra.profile || {};
  extra.profile[c.type] = cid;
  extra.stats = extra.stats || {};
  extra.stats.profile = 1;
  persistExtra();
  render();
}

function computeMetrics() {
  const E = items.filter(e => e.t !== 'set');
  const exp = E.filter(isExp), inc = E.filter(isInc);
  const uah = (v, cur) => { const r = rates[cur || 'UAH']; return Number.isFinite(r) ? v * r : 0; };
  const count = c => exp.filter(e => e.c === c).length;
  const dayList = [...new Set(E.map(e => e.d))].sort();
  let streak = 0, run = 0, prev = null;
  for (const d of dayList) {
    const t = new Date(d + 'T12:00');
    run = prev && (t - prev) / 864e5 < 1.5 ? run + 1 : 1;
    streak = Math.max(streak, run);
    prev = t;
  }
  const byM = {};
  for (const e of E) {
    const m = e.d.slice(0, 7);
    byM[m] = byM[m] || { exp: 0, inc: 0 };
    if (isInc(e)) byM[m].inc += uah(e.a, e.cur); else byM[m].exp += uah(myPart(e), e.cur);
  }
  const curYM = today().slice(0, 7);
  const b = extra.budget;
  let under = 0;
  if (b.total > 0) {
    const lim = uah(b.total, b.cur);
    for (const [m, x] of Object.entries(byM)) if (m < curYM && x.exp > 0 && x.exp <= lim) under++;
  }
  // дні без витрат — від першого запису до вчора
  const expDays = new Set(exp.map(e => e.d));
  let zero = 0;
  if (dayList.length) {
    const d = new Date(dayList[0] + 'T12:00'), end = new Date(); end.setHours(12, 0, 0, 0); end.setDate(end.getDate() - 1);
    for (let i = 0; d <= end && i < 3650; i++, d.setDate(d.getDate() + 1)) if (!expDays.has(iso(d.getFullYear(), d.getMonth(), d.getDate()))) zero++;
  }
  let night = 0, early = 0, weekend = 0;
  for (const e of E) {
    const ts = parseInt(String(e.id).slice(0, 8), 36); // id починається з часу створення
    if (ts > 1.6e12 && ts < 4e12) { const h = new Date(ts).getHours(); if (h < 5) night++; else if (h < 8) early++; }
    const wd = new Date(e.d + 'T12:00').getDay();
    if (wd === 0 || wd === 6) weekend++;
  }
  const st = extra.stats || {};
  return {
    entries: E.length, streak, days: dayList.length, months: Object.keys(byM).length,
    catsUsed: new Set(exp.map(e => e.c).filter(c => CATS.some(x => x.id === c))).size,
    food: count('food'), trans: count('trans'), fun: count('fun'), health: count('health'), clothes: count('clothes'), home: count('home'),
    coffee: E.filter(e => /(кав|кофе|coffee|латте|latte|капуч|cappuc|еспресо|espresso|американо|americano)/i.test(e.n || '')).length,
    incN: inc.length, incCats: new Set(inc.map(e => e.c)).size,
    posMonths: Object.values(byM).filter(x => x.inc > 0 && x.inc > x.exp).length,
    budgetSet: b.total > 0 ? 1 : 0, catLimits: Object.values(b.cats).filter(v => v > 0).length, underBudget: under,
    maxExp: Math.max(0, ...exp.map(e => uah(e.a, e.cur))),
    totalExp: exp.reduce((s, e) => s + uah(myPart(e), e.cur), 0), totalInc: inc.reduce((s, e) => s + uah(e.a, e.cur), 0),
    zeroDays: zero, small: exp.filter(e => { const v = uah(myPart(e), e.cur); return v > 0 && v < 50; }).length,
    splits: exp.filter(e => e.sp).length, people: extra.people.length, settles: items.filter(e => e.t === 'set').length,
    rec: Math.max(extra.recurring.length, new Set(items.filter(e => e.r).map(e => e.r)).size),
    voice: st.voice || 0, scan: st.scan || 0, export: st.export || 0, custom: st.custom ? 1 : 0, themes: (st.themes || []).length, profile: st.profile ? 1 : 0,
    night, early, weekend, curs: new Set(E.map(e => e.cur || 'UAH')).size,
  };
}

let achQueue = [];
let achCurrent = null;
function checkAchievements(silent) {
  if (!loaded || !extra.ach) return 0;
  const m = computeMetrics();
  const fresh = ACH.filter(a => !extra.ach[a.id] && (m[a.m] || 0) >= a.t);
  if (!fresh.length) return 0;
  for (const a of fresh) extra.ach[a.id] = today();
  persistExtra();
  if (!silent) {
    achQueue.push(...fresh);
    if (!achCurrent) showNextAch();
  }
  return fresh.length;
}

function cosPreview(cid, big) {
  const c = COS[cid];
  const type = c ? c.type : cid; // для «Без» передаємо тип
  if (type === 'avatar') return avaHTML(big ? 56 : 46, { avatar: cid, frame: '' });
  if (type === 'frame') return c ? avaHTML(big ? 50 : 42, { frame: cid }) : '<span class="none-prev">∅</span>';
  if (type === 'banner') return `<span class="bprev${ANIM_BANNERS.has(cid) ? ' anim' : ''}" style="background:${bannerBg(c ? cid : '')}"></span>`;
  if (type === 'color') return `<span class="cprev ${c ? 'nc-' + cid : ''}">${esc(profileName())}</span>`;
  if (type === 'title') return c ? `<span class="tprev">${esc(L(c.n))}</span>` : '<span class="none-prev">∅</span>';
  if (type === 'effect') return `<span class="bprev" style="background:linear-gradient(135deg,var(--accent),var(--l2))">${c ? effectHTML(cid, 8) : ''}</span>`;
  return '';
}

function showNextAch() {
  const a = achQueue.shift();
  achCurrent = a || null;
  const pop = $('achPop');
  if (!a) { pop.classList.remove('open'); updateBack(); return; }
  $('popCard').className = 'pop t-' + a.tier;
  $('popIco').textContent = a.ico;
  $('popK').textContent = `🏆 ${T.achUnlocked} · ${T.tiers[a.tier]}`;
  $('popN').textContent = L(a.n);
  $('popD').textContent = L(a.d);
  const c = COS[a.r];
  $('popR').innerHTML = `<div class="prev-box">${cosPreview(a.r, true)}</div><div><small>${T.reward} · ${T.types[c.type]}</small><b>${esc(L(c.n))}</b></div>`;
  $('popOk').textContent = T.cool;
  $('popEquip').textContent = T.equip;
  pop.classList.add('open');
  haptic('success');
  updateBack();
}
$('popOk').onclick = () => { tick(); showNextAch(); };
$('popEquip').onclick = () => { tick(); if (achCurrent) { equip(achCurrent.r); toast(T.equipped); } showNextAch(); };

/* ---------- Сторінка профілю ---------- */
let profTab = 'ach';
let achFilter = 'all';
function renderProfile() {
  const p = extra.profile || {};
  const m = computeMetrics();
  const got = ACH.filter(a => extra.ach[a.id]);
  const xp = got.reduce((s, a) => s + TIER[a.tier].xp, 0);
  const lvl = 1 + Math.floor(xp / 150), inLvl = xp % 150;
  const order = { epic: 0, gold: 1, silver: 2, bronze: 3 };
  const showcase = [...got].sort((a, b) => order[a.tier] - order[b.tier] || (extra.ach[b.id] || '').localeCompare(extra.ach[a.id] || '')).slice(0, 6);
  const title = p.title && isUnlocked(p.title) ? COS[p.title] : null;
  $('pcard').innerHTML = `
    <div class="banner${ANIM_BANNERS.has(p.banner) ? ' anim' : ''}" style="background:${bannerBg(isUnlocked(p.banner) ? p.banner : '')}">${isUnlocked(p.effect) ? effectHTML(p.effect) : ''}</div>
    <div class="pbody">
      ${avaHTML(96)}
      <div class="pname-row" id="nameRow"><span class="pname ${isUnlocked(p.color) ? 'nc-' + p.color : ''}">${esc(profileName())}</span><button class="ibtn" id="editName" aria-label="Edit">✏️</button></div>
      ${title ? `<div class="ptitle">${esc(L(title.n))}</div>` : ''}
      <div class="lvl"><b>${T.level(lvl)}</b><span>${inLvl} / 150 XP</span></div>
      <div class="progress"><i style="width:${inLvl / 150 * 100}%"></i></div>
      <div class="pstats">${T.pstats(m.entries, m.days, m.streak)}</div>
      <div class="showcase">${showcase.length ? showcase.map(a => `<span class="badge t-${a.tier}" title="${esc(L(a.n))}">${a.ico}</span>`).join('') : `<span class="muted">${T.showcaseEmpty}</span>`}</div>
    </div>`;
  $('editName').onclick = () => {
    $('nameRow').innerHTML = `<input id="nameIn" maxlength="24" placeholder="${esc(T.namePh)}" value="${esc(profileName())}"><button class="ibtn" id="nameOk">✓</button>`;
    const save = () => {
      extra.profile = { ...(extra.profile || {}), name: $('nameIn').value.trim().slice(0, 24) };
      persistExtra(); renderProfile();
    };
    $('nameOk').onclick = save;
    $('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
    $('nameIn').focus();
  };

  const tabs = $('profTabs');
  tabs.innerHTML = '';
  for (const [id, label] of [['ach', `🏆 ${T.achievements}`], ['cos', `🎨 ${T.cosmetics}`]]) {
    const b = document.createElement('button');
    b.textContent = label;
    if (id === profTab) b.className = 'on';
    b.onclick = () => { tick(); profTab = id; renderProfile(); };
    tabs.appendChild(b);
  }
  const body = $('profBody');
  body.innerHTML = '';
  if (profTab === 'ach') renderAchList(body, m, got.length);
  else renderCosmetics(body);
}

function renderAchList(body, m, gotN) {
  const sum = document.createElement('div');
  sum.className = 'card';
  sum.innerHTML = `<div class="ach-sum"><div class="big">🏆</div><div style="flex:1"><div style="font-weight:600">${T.gotOf(gotN, ACH.length)}</div>
    <div class="progress" style="margin:8px 0 0"><i style="width:${gotN / ACH.length * 100}%"></i></div></div></div>`;
  body.appendChild(sum);
  const chips = document.createElement('div');
  chips.className = 'chips';
  for (const [id, label] of [['all', T.fAll], ['todo', T.fTodo], ['got', T.fGot]]) {
    const b = document.createElement('button');
    b.textContent = label;
    if (id === achFilter) b.className = 'on';
    b.onclick = () => { tick(); achFilter = id; renderProfile(); };
    chips.appendChild(b);
  }
  body.appendChild(chips);
  const card = document.createElement('div');
  card.className = 'card';
  let list = ACH;
  if (achFilter === 'got') list = ACH.filter(a => extra.ach[a.id]);
  if (achFilter === 'todo') list = ACH.filter(a => !extra.ach[a.id]).sort((a, b) => (m[b.m] || 0) / b.t - (m[a.m] || 0) / a.t);
  for (const a of list) {
    const done = !!extra.ach[a.id];
    const cur = Math.min(m[a.m] || 0, a.t);
    const fmt = v => MONEY_METRICS.has(a.m) ? compact(v) : Math.floor(v);
    const c = COS[a.r];
    const el = document.createElement('div');
    el.className = `ach t-${a.tier}${done ? ' done' : ' locked'}`;
    el.innerHTML = `<div class="ach-ico">${a.ico}</div><div class="grow">
      <div class="ach-n"><span>${esc(L(a.n))}</span><small>${T.tiers[a.tier]}</small></div>
      <div class="ach-d">${esc(L(a.d))}</div>
      <div class="progress"><i style="width:${cur / a.t * 100}%;background:var(--tier)"></i></div>
      <div class="ach-meta"><span>${done ? '✓ ' + fmtDay(extra.ach[a.id]) : `${fmt(cur)} / ${fmt(a.t)}`}</span><span>🎁 ${T.types[c.type]}: ${esc(L(c.n))}</span></div></div>`;
    card.appendChild(el);
  }
  body.appendChild(card);
}

function renderCosmetics(body) {
  const p = extra.profile || {};
  for (const type of COS_TYPES) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="sec-t">${T.types[type]}</div>`;
    const grid = document.createElement('div');
    grid.className = 'cos-grid';
    const ids = Object.keys(COS).filter(id => COS[id].type === type && (id !== 'a_tg' || tgPhoto));
    const opts = type === 'avatar' ? ids : ['', ...ids];
    const current = type === 'avatar' ? (p.avatar || (tgPhoto ? 'a_tg' : 'a_letter')) : (p[type] || '');
    for (const id of opts) {
      const unlocked = !id || isUnlocked(id);
      const b = document.createElement('button');
      b.className = 'cos' + (id === current ? ' on' : '') + (unlocked ? '' : ' locked');
      b.innerHTML = `${unlocked ? '' : '<span class="lock">🔒</span>'}${cosPreview(id || type)}<span>${esc(id ? L(COS[id].n) : T.none)}</span>`;
      b.onclick = () => {
        if (!unlocked) { haptic('error'); toast(T.lockedHint(L(ACH_BY_REWARD[id].n))); return; }
        tick();
        extra.profile = { ...(extra.profile || {}), [type]: id };
        extra.stats = extra.stats || {};
        if (id) extra.stats.profile = 1;
        persistExtra();
        render();
      };
      grid.appendChild(b);
    }
    card.appendChild(grid);
    body.appendChild(card);
  }
}

/* =====================================================================
   Запуск
   ===================================================================== */
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { tick(); selectedDay = b.dataset.go === 'history' ? selectedDay : null; go(b.dataset.go); }));
$('fab').onclick = () => { tick(); openForm(null); };
$('gearBtn').onclick = () => { tick(); go('settings'); };
$('profBtn').onclick = () => { tick(); go('profile'); };
$('backBtn').onclick = () => { tick(); onBack(); };
$('prev').onclick = () => shiftMonth(-1);
$('next').onclick = () => shiftMonth(1);
$('clearDay').onclick = () => { selectedDay = null; render(); };
let searchTimer;
$('searchIn').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { hQuery = $('searchIn').value; selectedDay = null; renderHistory(); }, 150); });
try { tg.BackButton.onClick(onBack); } catch {}

// спершу — збережені на пристрої мова й тема, щоб не блимало
try {
  const ui = JSON.parse(localStorage.getItem('ui') || '{}');
  if (I18N[ui.lang]) cfg.lang = ui.lang;
  if (validCustom(ui.custom)) cfg.custom = ui.custom;
  if (THEMES[ui.theme] || ui.theme === 'custom') cfg.theme = ui.theme;
} catch {}
let hasUi = false;
try { hasUi = !!localStorage.getItem('ui'); } catch {}
const tgLang = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code;
if (!hasUi && tgLang && !/^(uk|ru)/.test(tgLang)) cfg.lang = 'en';
applyLang(cfg.lang);
applyTheme(cfg.theme);
go('home');
$('fab').disabled = true;

Promise.all([loadBlob('d', 'n', 'expenses'), loadCfg(), loadBlob('x', 'xn', 'extra')])
  .then(([raw, savedCfg, rawExtra]) => {
    items = raw ? JSON.parse(raw) : [];
    if (rawExtra) {
      const x = JSON.parse(rawExtra);
      extra = { ...extra, ...x, budget: { ...extra.budget, ...(x.budget || {}), cats: { ...(x.budget && x.budget.cats || {}) } } };
    }
    if (SYM[savedCfg.display]) cfg.display = savedCfg.display;
    if (SYM[savedCfg.input]) cfg.input = savedCfg.input;
    if (savedCfg.voiceLang) cfg.voiceLang = savedCfg.voiceLang;
    if (I18N[savedCfg.lang] && savedCfg.lang !== cfg.lang) { cfg.lang = savedCfg.lang; applyLang(cfg.lang); }
    if (validCustom(savedCfg.custom)) cfg.custom = savedCfg.custom;
    if (THEMES[savedCfg.theme] || savedCfg.theme === 'custom') cfg.theme = savedCfg.theme;
    if (!extra.budget.cur || !SYM[extra.budget.cur]) extra.budget.cur = cfg.display;
    applyTheme(cfg.theme);
    loaded = true;
    if (runRecurring()) { persist(); persistExtra(); }
    extra.stats = extra.stats || {};
    if (!(extra.stats.themes || []).includes(cfg.theme) && THEMES[cfg.theme]) extra.stats.themes = [...(extra.stats.themes || []), cfg.theme];
    if (cfg.theme === 'custom') extra.stats.custom = 1;
    if (!extra.ach) {
      extra.ach = {};
      const n = checkAchievements(true);
      persistExtra();
      if (n) setTimeout(() => toast(T.silentAch(n), 4500), 600);
    }
    $('fab').disabled = false;
    render();
  })
  // «+» не вмикаємо, щоб випадково не перезаписати збережені дані порожнім списком
  .catch(err => { console.error(err); alertMsg(T.loadErr); });
fetchRates();
</script>
